<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to bottom,#a1c4fd,#fbc2eb);
    text-align:center;
    overflow:hidden;
}

h1{
    margin-top:30px;
    color:#ff4081;
}

#instruction{
    margin-top:10px;
    color:#333;
}

#balloon-container{
    margin-top:40px;
}

.balloon{
    font-size:50px;
    cursor:pointer;
    display:inline-block;
    margin:10px;
    transition:transform .2s;
}

.balloon:hover{
    transform:scale(1.2);
}

#message-card{
    display:none;
    margin:40px auto;
    background:white;
    width:80%;
    max-width:500px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

#message-card h2{
    color:#ff4081;
}

#confetti{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
}

.piece{
    position:absolute;
    width:8px;
    height:8px;
    background:red;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    from{transform:translateY(-10px) rotate(0);}
    to{transform:translateY(100vh) rotate(360deg);}
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday! 🎉</h1>
<p id="instruction">Pop all the balloons to reveal your surprise 🎈</p>

<div id="balloon-container">
    <span class="balloon" onclick="popBalloon(this)">🎈</span>
    <span class="balloon" onclick="popBalloon(this)">🎈</span>
    <span class="balloon" onclick="popBalloon(this)">🎈</span>
    <span class="balloon" onclick="popBalloon(this)">🎈</span>
    <span class="balloon" onclick="popBalloon(this)">🎈</span>
</div>

<div id="message-card">
    <h2>🎂 Happy Birthday!</h2>
    <p>
        Hope you have an amazing day filled with laughter, good food,
        and great memories. You deserve all the happiness today and always!
    </p>
    <p>
        Thanks for being a great friend. Stay awesome! 🎉
    </p>

    <button onclick="resetPage()">Play Again</button>
</div>

<div id="confetti"></div>

<script>

let popped = 0;

function popBalloon(el){
    el.style.opacity = "0";
    el.style.transform = "scale(0)";
    el.style.pointerEvents = "none";

    popped++;

    if(popped === 5){
        showMessage();
    }
}

function showMessage(){
    document.getElementById("message-card").style.display = "block";
    document.getElementById("instruction").textContent = "🎉 Surprise Unlocked!";
    createConfetti();
}

function createConfetti(){

    const confetti = document.getElementById("confetti");

    for(let i = 0; i < 80; i++){

        let piece = document.createElement("div");
        piece.classList.add("piece");

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = getRandomColor();
        piece.style.animationDuration = (2 + Math.random() * 2) + "s";

        confetti.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        }, 4000);
    }
}

function getRandomColor(){
    const colors = ["#ff4081","#ffeb3b","#4caf50","#2196f3","#ff5722"];
    return colors[Math.floor(Math.random() * colors.length)];
}

function resetPage(){
    location.reload();
}

</script>

</body>
</html>
